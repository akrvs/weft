[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill via iroh transitive deps, no runtime exposure" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc macro pulled by iroh transitive deps, compile time only" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a proc macro pulled by iroh transitive deps, compile time only" },
]

[licenses]
version = 2
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
