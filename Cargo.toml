[workspace]
resolver = "3"
members = [
    "crates/browser",
    "crates/cli",
    "crates/core",
    "crates/gateway",
    "crates/home",
    "crates/net",
    "crates/relay",
    "crates/resolve",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
blake3 = { version = "1.8", default-features = false }
data-encoding = { version = "2.11", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc", "derive"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
clap = { version = "4.6", features = ["derive", "env"] }
rpassword = "7"
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
redb = "4.2"
tauri = { version = "2.11", default-features = false, features = ["wry", "unstable"] }
tauri-build = { version = "2.6", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
gtk = { version = "0.18", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time"] }
getrandom = "0.3"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "https-ring", "webpki-roots"] }
futures-util = { version = "0.3", default-features = false }
hyper = { version = "1.11", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http = { version = "1.5", default-features = false }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1.12", default-features = false }
percent-encoding = { version = "2.3", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
