<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="back" type="button" title="back">&#8592;</button>
  <form id="go">
    <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="address, author/name, domain, or https://">
  </form>
  <button id="compose-toggle" type="button">compose</button>
  <button id="store-toggle" type="button">store</button>
  <button id="identity" type="button">identity</button>
</header>
<section id="provenance" hidden>
  <span id="status"></span>
  <dl>
    <dt>address</dt><dd id="p-address"></dd>
    <dt>kind</dt><dd id="p-kind"></dd>
    <dt>author</dt><dd id="p-author"></dd>
    <dt>signer</dt><dd id="p-signer"></dd>
    <dt>created</dt><dd id="p-created"></dd>
    <dt>served by</dt><dd id="p-source"></dd>
    <dt>name</dt><dd id="p-name"></dd>
  </dl>
</section>
<section id="unsigned" hidden>unsigned page from the old web. nothing below this line is verified.</section>
<main id="content"></main>
<section id="compose" hidden>
  <form id="publish">
    <input id="name" type="text" spellcheck="false" autocomplete="off" placeholder="pointer name, optional">
    <textarea id="markdown" placeholder="# title&#10;&#10;markdown body"></textarea>
    <button type="submit">sign and push</button>
  </form>
  <pre id="publish-result"></pre>
</section>
<dialog id="who">
  <pre id="who-text"></pre>
  <button id="who-close" type="button">close</button>
</dialog>
<dialog id="store">
  <h2>your store</h2>
  <table id="store-kinds"></table>
  <h2>active grants</h2>
  <table id="store-grants"></table>
  <form id="revoke" hidden>
    <span id="revoke-target"></span>
    <button type="submit">revoke</button>
  </form>
  <pre id="store-result"></pre>
  <button id="store-close" type="button">close</button>
</dialog>
<dialog id="login">
  <h2>log in</h2>
  <dl>
    <dt>service</dt><dd id="login-service"></dd>
    <dt>expires</dt><dd id="login-expires"></dd>
    <dt>challenge</dt><dd id="login-nonce"></dd>
  </dl>
  <form id="login-form">
    <button type="submit">sign and log in</button>
    <button id="login-cancel" type="button">cancel</button>
  </form>
  <pre id="login-result"></pre>
</dialog>
<script type="module" src="dist/main.js"></script>
</body>
</html>
